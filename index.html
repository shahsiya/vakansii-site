<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Вакансии по Турции</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      font-size: 2em;
    }
    #refreshBtn {
      display: block;
      margin: 0 auto 20px auto;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      color: white;
      transition: background-color 0.3s ease;
    }
    #refreshBtn:hover {
      background-color: #0056b3;
    }
    .vacancy-card {
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .vacancy-title {
      font-weight: bold;
      font-size: 1.2em;
      margin-bottom: 8px;
    }
    .vacancy-desc {
      margin-bottom: 8px;
    }
    .vacancy-link {
      color: #007bff;
      text-decoration: none;
    }
    .vacancy-link:hover {
      text-decoration: underline;
    }
    .pagination {
      text-align: center;
      margin-top: 20px;
    }
    .pagination button {
      margin: 0 5px;
      padding: 10px 15px;
      font-size: 1em;
      border: none;
      background-color: #eee;
      cursor: pointer;
      border-radius: 5px;
    }
    .pagination button.active {
      background-color: #007bff;
      color: white;
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDslmTQU5CCDlBRFWLwqIaGW3HLFnGhTIg",
      authDomain: "vakansii-turkey.firebaseapp.com",
      projectId: "vakansii-turkey",
      storageBucket: "vakansii-turkey.appspot.com",
      messagingSenderId: "41794264957",
      appId: "1:41794264957:web:4f731aea57c51d24ec7614"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const pageSize = 50;
    let allVacancies = [];
    let currentPage = 1;

    function renderVacanciesPage(page) {
      const start = (page - 1) * pageSize;
      const end = start + pageSize;
      const vacanciesToShow = allVacancies.slice(start, end);

      const container = document.getElementById('vacancies');
      container.innerHTML = '';

      vacanciesToShow.forEach((vacancy) => {
        const card = document.createElement('div');
        card.className = 'vacancy-card';
        card.innerHTML = `
          <div class="vacancy-title">${vacancy.title_ru || vacancy.title || 'Без названия'}</div>
          <div class="vacancy-desc">${vacancy.description || vacancy.title_tr || ''}</div>
          <div><strong>Город:</strong> ${vacancy.city || 'Не указано'}</div>
          <div><strong>Компания:</strong> ${vacancy.company || 'Не указано'}</div>
          ${vacancy.url ? `<a href="${vacancy.url}" target="_blank" class="vacancy-link">Подробнее</a>` : ''}
        `;
        container.appendChild(card);
      });

      renderPaginationControls();
    }

    function renderPaginationControls() {
      const totalPages = Math.ceil(allVacancies.length / pageSize);
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === currentPage) btn.classList.add('active');
        btn.addEventListener('click', () => {
          currentPage = i;
          renderVacanciesPage(currentPage);
        });
        pagination.appendChild(btn);
      }
    }

    async function loadVacancies() {
      const vacanciesContainer = document.getElementById('vacancies');
      vacanciesContainer.innerHTML = '<p>Загрузка вакансий...</p>';
      allVacancies = [];
      currentPage = 1;

      try {
        const querySnapshot = await getDocs(collection(db, "vacancies"));
        querySnapshot.forEach((doc) => {
          allVacancies.push(doc.data());
        });

        if (allVacancies.length === 0) {
          vacanciesContainer.innerHTML = '<p>Вакансий пока нет.</p>';
          return;
        }

        renderVacanciesPage(currentPage);
      } catch (error) {
        vacanciesContainer.innerHTML = `<p>Ошибка загрузки: ${error.message}</p>`;
      }
    }

    window.onload = () => {
      loadVacancies();
      document.getElementById('refreshBtn').addEventListener('click', () => {
        loadVacancies();
      });
    };
  </script>
</head>
<body>
  <h1>Вакансии по Турции</h1>
  <button id="refreshBtn">Обновить список</button>
  <div id="vacancies"></div>
  <div class="pagination" id="pagination"></div>
</body>
</html>
