<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Вакансии по Турции</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      font-size: 2em;
    }
    #refreshBtn {
      display: block;
      margin: 0 auto 20px auto;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      background-color: #007bff;
      border: none;
      border-radius: 5px;
      color: white;
      transition: background-color 0.3s ease;
    }
    #refreshBtn:hover {
      background-color: #0056b3;
    }
    .vacancy-card {
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .vacancy-title {
      font-weight: bold;
      font-size: 1.2em;
      margin-bottom: 8px;
    }
    .vacancy-desc {
      margin-bottom: 8px;
    }
    .vacancy-link {
      color: #007bff;
      text-decoration: none;
    }
    .vacancy-link:hover {
      text-decoration: underline;
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDslmTQU5CCDlBRFWLwqIaGW3HLFnGhTIg",
      authDomain: "vakansii-turkey.firebaseapp.com",
      projectId: "vakansii-turkey",
      storageBucket: "vakansii-turkey.appspot.com",
      messagingSenderId: "41794264957",
      appId: "1:41794264957:web:4f731aea57c51d24ec7614"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadVacancies() {
      const vacanciesContainer = document.getElementById('vacancies');
      vacanciesContainer.innerHTML = '<p>Загрузка вакансий...</p>';

      try {
        const querySnapshot = await getDocs(collection(db, "vacancies"));
        vacanciesContainer.innerHTML = '';

        if (querySnapshot.empty) {
          vacanciesContainer.innerHTML = '<p>Вакансий пока нет.</p>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const vacancy = doc.data();
          const card = document.createElement('div');
          card.className = 'vacancy-card';

          card.innerHTML = `
            <div class="vacancy-title">${vacancy.title_ru || vacancy.title || 'Без названия'}</div>
            <div class="vacancy-desc">${vacancy.description || vacancy.title_tr || ''}</div>
            <div><strong>Город:</strong> ${vacancy.city || 'Не указано'}</div>
            <div><strong>Компания:</strong> ${vacancy.company || 'Не указано'}</div>
            ${vacancy.url ? `<a href="${vacancy.url}" target="_blank" class="vacancy-link">Подробнее</a>` : ''}
          `;

          vacanciesContainer.appendChild(card);
        });

      } catch (error) {
        vacanciesContainer.innerHTML = `<p>Ошибка загрузки: ${error.message}</p>`;
      }
    }

    window.onload = () => {
      loadVacancies();

      document.getElementById('refreshBtn').addEventListener('click', () => {
        loadVacancies();
      });
    };
  </script>
</head>
<body>
  <h1>Вакансии по Турции</h1>
  <button id="refreshBtn">Обновить список</button>
  <div id="vacancies"></div>
</body>
</html>
